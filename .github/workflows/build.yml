name: build-jre

# 推 v* tag 自动跑全量构建并发布正式 release;
# 每天北京时间 00:00 定时全量构建,更新滚动 nightly release;
# 也可在 Actions 页面手动触发(可只跑指定主版本,仅产出 artifact)。
on:
  push:
    tags:
      - 'v*'
  schedule:
    # cron 走 UTC;16:00 UTC = 次日 00:00 北京时间
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      majors:
        description: '逗号分隔的主版本号 (默认: 8,17,21,25)'
        required: false
        default: '8,17,21,25'

permissions:
  contents: read

jobs:
  prepare:
    name: parse majors
    runs-on: ubuntu-latest
    outputs:
      majors: ${{ steps.m.outputs.majors }}
    steps:
      - id: m
        run: |
          # tag push 时输入为空 → 用默认全量;手动触发可只跑某个版本
          MAJORS="${{ github.event.inputs.majors || '8,17,21,25' }}"
          # 逗号串 → JSON 数组字符串,喂给 build 的 fromJSON
          JSON=$(echo "$MAJORS" | awk -F, \
            '{for(i=1;i<=NF;i++){printf "%s\"%s\"",(i>1?",":""),$i}}')
          echo "majors=[$JSON]" >> "$GITHUB_OUTPUT"

  build:
    name: jre${{ matrix.major }}-aarch64
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        major: ${{ fromJSON(needs.prepare.outputs.majors) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup deps
        run: |
          sudo apt-get update -qq
          # 通用依赖
          sudo apt-get install -y --no-install-recommends \
            binutils jq xz-utils ca-certificates curl libarchive-tools
          # JRE8: unpack200 + boot JDK
          sudo apt-get install -y --no-install-recommends \
            openjdk-8-jre-headless openjdk-8-jdk
          # 16KB page 对齐检测工具
          sudo apt-get install -y --no-install-recommends llvm
          # JRE8 源码交叉编译依赖
          sudo apt-get install -y --no-install-recommends \
            autoconf python3 python-is-python3 unzip zip \
            systemtap-sdt-dev gcc-multilib g++-multilib \
            libxtst-dev libasound2-dev libelf-dev \
            libfontconfig1-dev libx11-dev libcups2-dev \
            libxext-dev libxrender-dev libxt-dev

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      # ---- 17/21/25: Termux prebuilt deb -> normalize ----------------------
      - name: Fetch Termux deb
        if: matrix.major != '8'
        env:
          MAJOR: ${{ matrix.major }}
          ARCH: aarch64
        run: ./scripts/fetch_termux_jdk.sh

      - name: Normalize JRE
        if: matrix.major != '8'
        env:
          MAJOR: ${{ matrix.major }}
          ARCH: aarch64
          JAVA_HOME8: /usr/lib/jvm/java-8-openjdk-amd64
        run: ./scripts/normalize_jre.sh

      # ---- 8: 源码交叉编译 ------------------------------------------------
      - name: Build JRE8 from source
        if: matrix.major == '8'
        env:
          MAJOR: '8'
          ARCH: aarch64
          JAVA_HOME8: /usr/lib/jvm/java-8-openjdk-amd64
        run: ./scripts/build_openjdk_source.sh

      # ---- 通用: staging -> tar.xz -----------------------------------------
      - name: Pack tar.xz
        env:
          MAJOR: ${{ matrix.major }}
          ARCH: aarch64
        run: ./scripts/pack_tar_xz.sh

      - name: Check 16KB page alignment (warn-only)
        run: |
          SO=$(find build/staging/lib -name libjvm.so -print -quit)
          if [ -n "$SO" ]; then
            # Align 是 readelf -l 的最后一段($2 是 Offset,取错列会恒为 0 并误报)
            ALIGN=$(llvm-readelf -l "$SO" | awk '$1=="LOAD" {print $NF; exit}')
            echo "libjvm.so LOAD align = $ALIGN (16KB=0x4000)"
            if [[ -n "$ALIGN" ]] && (( ALIGN < 16384 )); then
              echo "::warning::libjvm.so align < 16KB, may fail on Android 15+"
            fi
          fi

      - name: Verify archive
        run: |
          OUT=build/out/jre${{ matrix.major }}-aarch64.tar.xz
          xz -t "$OUT"
          echo "size: $(stat -c%s "$OUT") bytes"

      # 只上传 build/out/ 一个目录:upload-artifact 会把该目录的“内容”放到
      # artifact 根下,下载端 merge-multiple 归并后路径才是平的。之前把
      # build/out/xxx.tar.xz 和 build/deb-version.txt 并列写,两者最小公共父
      # 目录是 build/,artifact 里就多出一层 out/,release job 的
      # `cp build/_artifacts/*.tar.xz` 因而找不到文件。
      - name: Stage deb version
        run: |
          if [[ -f build/deb-version.txt ]]; then
            # 按主版本改名,避免 4 个 artifact 归并时 deb-version.txt 互相覆盖
            cp build/deb-version.txt "build/out/jre${{ matrix.major }}-deb-version.txt"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: jre${{ matrix.major }}-aarch64
          path: build/out/
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish release
    needs: build
    # tag push → 正式 release;定时任务 → 更新滚动 nightly release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: build/_artifacts
          merge-multiple: true

      - name: Layout out/
        run: |
          mkdir -p build/out
          # 递归找 tar.xz,不依赖 artifact 内部的目录层级
          count=$(find build/_artifacts -type f -name '*.tar.xz' | wc -l)
          [[ "$count" -gt 0 ]] || { echo "!! artifacts 里没有 tar.xz" >&2; exit 1; }
          find build/_artifacts -type f -name '*.tar.xz' -exec cp -t build/out/ {} +
          # 每个产物对应的 Termux deb 版本(由 build job 按主版本留存)
          find build/_artifacts -type f -name '*-deb-version.txt' \
            -exec cp -t build/out/ {} +
          # 顶层 termux_version 只是个代表值(8 是源码构建,17/21/25 才是 Termux
          # deb,版本可能互不相同;以 manifest 里 files[].termux_version 为准)。
          if [[ -f build/_artifacts/deb-version.txt ]]; then
            cp build/_artifacts/deb-version.txt build/deb-version.txt
          else
            rep=$(find build/_artifacts -type f -name '*-deb-version.txt' | sort | head -1)
            if [[ -n "$rep" ]]; then
              cp "$rep" build/deb-version.txt
            else
              echo unknown > build/deb-version.txt
            fi
          fi

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Generate manifest
        run: ./scripts/generate_manifest.sh

      # 定时任务没有 tag,统一打到 rolling 的 nightly tag 上;
      # 标 prerelease 避免 nightly 抢占 "Latest release" 位置。
      - name: Resolve release tag
        id: rel
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            echo "tag=nightly"     >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "notes=false"     >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false"       >> "$GITHUB_OUTPUT"
            echo "notes=true"             >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          prerelease: ${{ steps.rel.outputs.prerelease }}
          generate_release_notes: ${{ steps.rel.outputs.notes }}
          files: |
            build/out/*.tar.xz
            build/out/manifest.json
          fail_on_unmatched_files: true
